[package]
name = "rust-crypto"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# The upstream harness source uses `rsa::`; this maps it to sad-rsa.
#
# Default: the sad-rsa source tree mounted at /sad-rsa (see README.md).
# To test a published release instead, replace the line below with e.g.
#   rsa = { version = "=0.10.5", package = "sad-rsa", features = ["sha2"] }
rsa = { path = "/sad-rsa", package = "sad-rsa", features = ["sha2"] }

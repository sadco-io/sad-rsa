# cargo-deny configuration. Run locally with `cargo deny check`.

[graph]
all-features = true

[advisories]
yanked = "deny"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    # CC0-1.0 is a public domain dedication: permissive, no obligations,
    # FSF Free/Libre.
    "CC0-1.0",
    # CDLA-Permissive-2.0 is a permissive data licence (Linux Foundation).
    "CDLA-Permissive-2.0",
    "Zlib",
    "MPL-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"

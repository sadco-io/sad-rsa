name: CI

on:
  pull_request:
  push:
    branches:
      - main

env:
  RUSTFLAGS: "-Dwarnings"
  RUSTDOCFLAGS: "-Dwarnings"

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The PR run already tested this exact tree -- strict status checks
    # require the branch to be current with main before it can merge -- so the
    # post-merge run re-verifies content that just passed. It still runs, for a
    # smoke signal on main, but the matrix collapses to one representative leg.
    # 1.85.0 is the MSRV; the full matrix runs on every pull_request.
    strategy:
      matrix:
        rust: ${{ (github.event_name == 'push' && fromJSON('["stable"]')) || fromJSON('["1.85.0","stable"]') }}
        target: ${{ (github.event_name == 'push' && fromJSON('["thumbv7em-none-eabi"]')) || fromJSON('["thumbv7em-none-eabi","wasm32-unknown-unknown"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - run: cargo build --no-default-features --target ${{ matrix.target }}

  test:
    runs-on: ubuntu-latest
    # The PR run already tested this exact tree -- strict status checks
    # require the branch to be current with main before it can merge -- so the
    # post-merge run re-verifies content that just passed. It still runs, for a
    # smoke signal on main, but the matrix collapses to one representative leg.
    # 1.85.0 is the MSRV; the full matrix runs on every pull_request.
    strategy:
      matrix:
        rust: ${{ (github.event_name == 'push' && fromJSON('["stable"]')) || fromJSON('["1.85.0","stable"]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: RustCrypto/actions/cargo-hack-install@master
      - run: cargo hack test --release --feature-powerset --exclude-features getrandom,serde
      - run: cargo test --release --features getrandom
      - run: cargo test --release --features serde

  minimal-versions:
    if: false # disabled until we remove pre-releases dependencies 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo update -Z minimal-versions
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release --features getrandom,serde,pkcs5

  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: RustCrypto/actions/cargo-cache@master
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2025-02-22
      - run: cargo build --benches

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
